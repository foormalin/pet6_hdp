name: ${COMPOSE_PROJECT_NAME:-helpdesk}

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --innodb-file-per-table=1
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    pids_limit: 256

  db-exporter-init:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      METRICS_DB_USER: ${METRICS_DB_USER:-exporter}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?METRICS_DB_PASSWORD is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mariadb --host=db --user=root --password="$${MARIADB_ROOT_PASSWORD}" --execute="
          CREATE USER IF NOT EXISTS '$${METRICS_DB_USER}'@'%' IDENTIFIED BY '$${METRICS_DB_PASSWORD}';
          ALTER USER '$${METRICS_DB_USER}'@'%' IDENTIFIED BY '$${METRICS_DB_PASSWORD}';
          GRANT PROCESS, REPLICATION CLIENT, SELECT, SLAVE MONITOR ON *.* TO '$${METRICS_DB_USER}'@'%';
          FLUSH PRIVILEGES;"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0.11}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      GLPI_DB_HOST: db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      GLPI_CRONTAB_ENABLED: "1"
    volumes:
      - glpi_data:/var/glpi
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 1g
    pids_limit: 256

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      glpi:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    mem_limit: 128m
    pids_limit: 128

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter
      - cadvisor
      - node-exporter
      - mysql-exporter
    networks:
      - frontend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m
    pids_limit: 128

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.2}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - frontend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 512m
    pids_limit: 128

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.27.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9115/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 64

  mysql-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE:-prom/mysqld-exporter:v0.20.0}
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${METRICS_DB_PASSWORD:?METRICS_DB_PASSWORD is required}
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=${METRICS_DB_USER:-exporter}
      - --collect.info_schema.tables
      - --collect.global_status
      - --collect.global_variables
    expose:
      - "9104"
    depends_on:
      db-exporter-init:
        condition: service_completed_successfully
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9104/metrics >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 64

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.55.1}
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    pids_limit: 128

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    pids_limit: 64

networks:
  frontend:
  backend:
    internal: true
  monitoring:
    internal: true

volumes:
  db_data:
  glpi_data:
  prometheus_data:
  grafana_data:
